name: studia
description: "Smart Study To-Do List app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  provider: ^6.1.5+1
  shared_preferences: ^2.2.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.0

# Flutter launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/studia_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/